name: Sync to GitHub

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'scripts/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove scripts directory
        run: rm -rf scripts/

      - name: Push to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/wirehack7/profilarr-db.git

          git add -A
          git diff --cached --quiet || git commit -m "chore: remove scripts before sync"

          git push github HEAD:main --force
